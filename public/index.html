<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Dextra</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#116466">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#eef5f3;--panel:#fff;--ink:#2c3531;--mute:#5d6b66;--acc:#116466;--acc2:#d9b08c;--hi:#ffcb9a;--soft:#d1e8e2;--line:#c5dad4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-t="dark"]{--bg:#1b2220;--panel:#252e2b;--ink:#e6f1ee;--mute:#9fb3ad;--acc:#2aa3a5;--line:#36423e;--soft:#2c3935}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;display:flex}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
nav{width:190px;padding:28px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;flex:none}
nav .logo{font:600 26px Fraunces,Georgia,serif;padding:0 12px 18px;color:var(--acc)}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;color:var(--mute)}
nav button.on{background:var(--soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--acc2)}
main{flex:1;min-width:0;overflow:auto;padding:28px clamp(16px,4vw,56px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ghost{all:unset;cursor:pointer;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.btn{all:unset;cursor:pointer;padding:9px 16px;border-radius:10px;background:var(--acc);color:#fff}
.btn.s{background:var(--acc2);color:#2c3531}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0}
input:focus,textarea:focus{border-color:var(--acc)}
.sub{color:var(--mute)}
.msgs{display:flex;flex-direction:column;gap:10px;margin:14px 0;max-height:46vh;overflow:auto}
.m{padding:10px 14px;border-radius:14px;max-width:85%;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--acc);color:#fff}
.m.a{align-self:flex-start;background:var(--soft)}
.m small{display:block;margin-top:6px}
.compose{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:6px 6px 6px 14px}
.compose input{flex:1;border:0;background:transparent}
.round{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;text-align:center;line-height:38px}
.chips span{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--soft);margin:2px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px}
.seg button.on{background:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{min-height:70px;border:1px solid var(--line);border-radius:8px;padding:4px;font-size:12px;background:var(--panel)}
.day.today{border-color:var(--acc2);box-shadow:inset 0 0 0 1px var(--acc2)}.day.x{opacity:.4}
.ev{background:var(--hi);color:#2c3531;border-radius:5px;padding:1px 4px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.clock{font:600 44px Fraunces,Georgia,serif;color:var(--acc)}
#set{position:fixed;top:0;right:0;bottom:0;width:min(360px,100%);background:var(--panel);border-left:1px solid var(--line);padding:22px;overflow:auto;transform:translateX(105%);transition:.25s;z-index:20;padding-top:calc(22px + env(safe-area-inset-top,0px))}
#set.open{transform:none}
#set h3{margin:18px 0 6px;font-size:16px}
.li{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.li span{flex:1}.done span{text-decoration:line-through;color:var(--mute)}
.x1{all:unset;cursor:pointer;color:var(--mute)}
@media(max-width:700px){body{flex-direction:column-reverse}nav{width:100%;flex-direction:row;overflow-x:auto;border-right:0;border-top:1px solid var(--line);padding:6px}nav .logo{display:none}nav button{white-space:nowrap}main{padding:18px 14px}.day{min-height:54px}}
</style>
</head>
